name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  marketing:
    name: Marketing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  web:
    name: Web (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/cryprice_test
      BOT_TOKEN: test-token-for-ci
      JWT_ACCESS_SECRET: test-jwt-access-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck shared
        working-directory: packages/shared
        run: npm install --no-workspaces && npm run typecheck
      - name: Typecheck api-client
        working-directory: packages/api-client
        run: |
          npm pkg set dependencies.@cryprice/shared="file:../shared"
          npm install --no-workspaces
          npm run typecheck
